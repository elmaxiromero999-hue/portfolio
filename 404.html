<!-- GitHub Pages sirve esta página para cualquier dirección que no existe: los links son absolutos (/portfolio/). Con dominio propio, cambiar BASE a "/". -->
<style>
  :root { --papel: #fff; --tinta: #1800ff; --gris: #5b5bff; }
  @media (prefers-color-scheme: dark) { :root { --papel: #000; --tinta: #fff; --gris: #8c92ff; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100svh; display: grid; place-content: center; gap: 22px; padding: 24px 16px; background: var(--papel); color: var(--tinta); font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .n { font-size: clamp(90px, 22vw, 220px); font-weight: 600; letter-spacing: -.06em; line-height: .8; }
  p { font-size: 18px; color: var(--gris); max-width: 32ch; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; }
  a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border: 1px solid var(--tinta); color: var(--tinta); text-decoration: none; font-weight: 500; }
  a:first-child { background: var(--tinta); color: var(--papel); }
</style>
</head>
<body>
  <h1 class="n">404</h1>
  <p>Esta página no existe o cambió de lugar.</p>
  <nav><a href="/portfolio/">Ir al inicio</a><a href="/portfolio/obras.html">Obra</a><a href="/portfolio/diseno.html">Diseño y motion</a></nav>
